name: Nightly

# The counterpart to ci.yml, which gates every push on the offline tests alone.
# This runs the two lanes that cannot gate a merge — the ones that query real
# resolvers, and the ones that drive external tools — plus the question the
# gate structurally cannot ask: does the suite still agree with Hermod's
# *current* master, rather than with the revision the gitlinks pin?
#
# Two things worth knowing about scheduled workflows: they only ever run on the
# default branch, and GitHub disables them after 60 days without repository
# activity. If this stops reporting, that is the first thing to check.
on:
  schedule:
    # 03:41 UTC. Off the hour on purpose: GitHub's scheduler is busiest then and
    # delays runs by tens of minutes.
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------------------
  # The full suite against the pinned submodules, on both platforms.
  # ---------------------------------------------------------------------------
  full-suite:
    # `leg` names the runs and their artifacts: the Linux leg runs on
    # ubuntu-latest but IS Debian 13 — see ci.yml.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    name: ${{ matrix.leg }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Must precede the checkout: without git in the container, checkout falls
      # back to a REST-API tarball, which cannot carry submodules. See ci.yml.
      - name: Install git (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install .NET prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get install -y --no-install-recommends curl libicu76 libssl3t64 libstdc++6 tzdata

      # The interop lane drives dig, kdig, drill and delv, and BIND signs the
      # DNSSEC fixtures. On a developer machine these live inside WSL and the
      # Windows firewall usually blocks the tools from reaching the server under
      # test, so the 38 interop tests skip. Here they are native, on the same
      # loopback as the server, with nothing in between — which is the main
      # reason this workflow is worth having at all.
      - name: Install the DNS tools (Debian container)
        if: runner.os == 'Linux'
        run: apt-get install -y --no-install-recommends bind9-dnsutils knot-dnsutils ldnsutils bind9 bind9utils

      # ISC's genreport is the one verdict in this suite that the suite does not
      # reach itself, so a nightly where it silently skips is a nightly that
      # stopped asking. It is not packaged anywhere, hence the build; the script
      # carries the one workaround it needs. No BIND development package is
      # involved despite appearances — the tool wants libresolv, which glibc
      # provides.
      - name: Build ISC genreport (Debian container)
        if: runner.os == 'Linux'
        run: |
          # libc6-dev is only a *recommended* dependency of gcc, so
          # --no-install-recommends leaves the compiler unable to link
          # anything: "C compiler cannot create executables".
          apt-get install -y --no-install-recommends gcc libc6-dev make autoconf automake pkg-config libssl-dev socat
          sh interop/genreport/build-genreport.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The committed DNSSEC fixtures carry real BIND signatures, and real
      # signatures expire — a month after they were made. Re-signing here means
      # this workflow can never go red for that reason, and it exercises
      # resign.sh itself, which had been unrunnable on a Windows checkout for
      # some time without anyone noticing.
      #
      # Windows keeps the committed fixtures: re-signing needs BIND, which is
      # what the WSL lane is for and is not installed on that runner.
      - name: Re-sign the DNSSEC fixtures (Debian container)
        if: runner.os == 'Linux'
        run: sh fixtures/zones/resign.sh

      # Every interop verdict here is gated on its tool being present:
      # TestEnvironment calls Assert.Ignore when one is missing, NUnit records
      # that as a skip rather than a failure, and the steps below would pass
      # having asked nothing. On a developer machine that is exactly right -- a
      # missing kdig is not a conformance result. In this job the same silence
      # is a lie, because the steps above installed every one of them.
      #
      # So they are checked here, in the idiom the container-servers job already
      # uses for Docker: failing on a missing prerequisite means a skip can only
      # ever be about the runner, never about something this workflow forgot to
      # install. genreport is in the list for the reason its own build step
      # gives -- it is the one verdict the suite cannot reach by itself, so a
      # night where it silently skips is a night that stopped asking.
      #
      # named gets a -V rather than only a command -v. BIND is the one daemon in
      # this list, and a binary that is present but cannot run is exactly the
      # failure mode that let NTSConformanceTests' upstream-peer lane report
      # agreement for a whole run against a chronyd that never started.
      - name: Check the interop prerequisites are really there (Debian container)
        if: runner.os == 'Linux'
        run: |
          set -e
          for tool in dig kdig drill delv named named-checkconf named-checkzone genreport; do
            command -v "${tool}"
          done
          named -V | head -1

      - name: Build
        run: dotnet build DNSConformanceTests.slnx --configuration Release

      # Fatal: the same set the gate runs. Repeating it catches tests that only
      # fail sometimes, and on the Linux leg it now runs against freshly signed
      # fixtures rather than the committed ones.
      - name: Test (offline)
        timeout-minutes: 45
        run: >
          dotnet test DNSConformanceTests.slnx --configuration Release --no-build
          --filter "TestCategory!=Online&TestCategory!=WSL&TestCategory!=Docker&TestCategory!=Multicast"
          --logger "console;verbosity=normal"
          --logger "trx;LogFilePrefix=offline"
          --results-directory artifacts

      # Fatal on Linux, where the tools are present and reachable: a red here is
      # a real interoperability regression — dig, kdig or drill disagreeing with
      # what Hermod put on the wire. On Windows there is no WSL on the runner,
      # so every test in this category skips and the step passes trivially.
      #
      # And on Linux a skip is a failure too, which is the opposite of what a
      # skip means elsewhere in this suite. Windows skipping all of them is
      # honest reporting. The Debian leg skipping even one means a check could
      # not use a tool the step above has just proved runs, and a green step
      # would be reporting agreement it never measured. The bar is what the
      # night of 2026-10-04 measured: 73 passed, 0 skipped.
      #
      # The counts are summed rather than read from a grand total, because this
      # filter spans two assemblies and the SDK here prints one summary per
      # assembly and no total. Summing cannot flip the verdict either way: all
      # zeroes sum to zero, and a future SDK that printed both would only
      # overstate a number that was already non-zero.
      - name: Test (interop against dig, kdig, drill, BIND)
        timeout-minutes: 45
        shell: bash
        run: |
          set +e
          dotnet test DNSConformanceTests.slnx --configuration Release --no-build \
            --filter "TestCategory=WSL" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFilePrefix=interop" \
            --results-directory artifacts > interop.out 2>&1
          rc=$?
          cat interop.out
          [ "${rc}" -eq 0 ] || exit "${rc}"
          if [ "${RUNNER_OS}" = "Linux" ]; then
            skipped=0
            for n in $(grep -oE 'Skipped: +[0-9]+' interop.out | grep -oE '[0-9]+'); do
              skipped=$((skipped + n))
            done
            echo "skipped on this leg: ${skipped}"
            if [ "${skipped}" -ne 0 ]; then
              echo "FAIL: ${skipped} interop checks skipped although every tool is installed."
              exit 1
            fi
          fi

      # Bidirectional live DNS-SD interop. Windows ships dns-sd.exe; the
      # capability-gated tests skip on hosts without a native command or a
      # multicast-capable interface.
      - name: Test (native multicast DNS-SD)
        timeout-minutes: 10
        run: >
          dotnet test DNSConformanceTests.slnx --configuration Release --no-build
          --filter "TestCategory=Multicast"
          --logger "console;verbosity=normal"
          --logger "trx;LogFilePrefix=multicast"
          --results-directory artifacts

      # Informational, and it has to be. These query Cloudflare, Google and
      # Quad9 for real, and a hosted runner is not a normal client: datacentre
      # egress on UDP/53 is often restricted and the DoH endpoints rate-limit
      # these address ranges. A failure here means "the runner could not ask",
      # which says nothing about Hermod's resolver — so it must not be able to
      # turn the night red. Read the numbers for a trend; a sudden 23/23 failure
      # IS worth looking at.
      - name: Test (live resolvers, informational)
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          dotnet test DNSConformanceTests.slnx --configuration Release --no-build \
            --filter "TestCategory=Online" --logger "console;verbosity=normal" \
            --logger "trx;LogFilePrefix=online" --results-directory artifacts 2>&1 | tee online.txt
          {
            echo '## Live resolvers (informational, ${{ runner.os }})'
            echo
            echo 'Network-dependent: failures here reflect runner egress, not Hermod.'
            echo
            echo '```'
            grep -E "Passed!|Failed!|error|Passed:|Failed:" online.txt || tail -5 online.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # One artifact per leg, holding every lane's TRX files. The interop and
      # live lanes run only in this workflow, so their per-test outcomes —
      # including every skip reason — exist nowhere else once the console log
      # ages out.
      #
      # !cancelled() rather than success(): a red night is when these files
      # matter most, and uploading only on green would throw away the evidence
      # in exactly that case.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: artifacts/*.trx

  # ---------------------------------------------------------------------------
  # The referee job: the same suite against Hermod's current master.
  # ---------------------------------------------------------------------------
  against-hermod-master:
    # The gate above tests the revision the gitlinks pin, which is the right
    # question for "would a fresh clone build". It is the wrong question for
    # what this repository claims to be — an unbiased referee that can be
    # pointed at any Hermod revision. Nothing in the gate notices when Hermod
    # moves, because a push to Hermod does not touch this repository at all.
    #
    # So: check the submodule out at master and run the offline suite against
    # it. Red here means Hermod changed in a way the suite disagrees with, and
    # it is a finding rather than a build failure — which is why this job is
    # separate from the one above, and why the interop and live lanes are left
    # out. One question at a time.
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      # Must precede the checkout, as in the job above — and this job needs git
      # afterwards too, to move the submodules off their pinned revisions.
      - name: Install git (Debian container)
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install .NET prerequisites (Debian container)
        run: apt-get install -y --no-install-recommends curl libicu76 libssl3t64 libstdc++6 tzdata

      - name: Move the submodules to master
        run: |
          git config --global --add safe.directory '*'
          git submodule foreach 'git fetch origin master && git checkout FETCH_HEAD'
          echo "### Submodule revisions under test" >> "$GITHUB_STEP_SUMMARY"
          git submodule status >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build DNSConformanceTests.slnx --configuration Release

      - name: Test (offline, against Hermod master)
        timeout-minutes: 45
        run: >
          dotnet test DNSConformanceTests.slnx --configuration Release --no-build
          --filter "TestCategory!=Online&TestCategory!=WSL&TestCategory!=Docker&TestCategory!=Multicast"
          --logger "console;verbosity=normal"
          --logger "trx;LogFilePrefix=offline"
          --results-directory artifacts

      # Same reasoning as the full suite: red is when the evidence matters.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-against-hermod-master
          path: artifacts/*.trx

  # ---------------------------------------------------------------------------
  # Everything that needs containers of its own and cannot live in one.
  # ---------------------------------------------------------------------------
  container-servers:
    # The two jobs above run *inside* debian:13, which is why this one does not:
    # Zonemaster ships as a container, and running one from inside another needs
    # a privileged daemon that a hosted runner does not hand out. So this leg
    # takes the runner as it comes — ubuntu-latest has Docker already — and
    # installs only what the harness needs on top.
    #
    # Everything here skips rather than fails when a piece is missing, which is
    # the right behaviour on a developer machine and the wrong one here: a green
    # nightly that asked nothing is worse than a red one. Hence the explicit
    # guards below, which turn "not set up" into a failure in this job alone.
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # socat bridges the ephemeral port the fixture binds to port 53, which is
      # the only port Zonemaster speaks to. dig comes along for the harness's
      # own check that the bridge carries anything.
      - name: Install socat and dig
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends socat bind9-dnsutils

      # Pulled up front rather than on demand: a fixture that downloads a
      # hundred megabytes mid-test fails as a timeout somewhere unrelated.
      - name: Pull the server images
        run: |
          docker pull zonemaster/cli
          docker pull cznic/knot
          docker pull coredns/coredns
          docker pull mvance/unbound

      # The harness skips when any of these is absent. Failing here instead
      # means the skip can only ever be about the runner, never about a
      # prerequisite this workflow forgot to install.
      - name: Check the prerequisites are really there
        run: |
          set -e
          command -v socat
          command -v dig
          docker info --format '{{.ServerVersion}}'
          for image in zonemaster/cli cznic/knot coredns/coredns mvance/unbound; do
            docker image inspect "$image" > /dev/null
          done
          sudo -n true
          test -z "$(ss -lun 2>/dev/null | grep '127.0.0.1:53 ' || true)" \
            || { echo 'something already holds 127.0.0.1:53'; exit 1; }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build DNSConformanceTests.slnx --configuration Release

      # Fatal, and two different questions in one filter. Zonemaster's recorded
      # tag set is asserted exactly, so red there is either a new complaint about
      # Hermod or an old one that stopped being made. The foreign servers ask
      # whether what Hermod reads is a property of the protocol or of BIND —
      # red there means three encoders disagree with the reading.
      #
      # Under sudo, and that is the contract rather than a shortcut: binding
      # port 53 is privileged, and Wsl.Run(asRoot) deliberately does not reach
      # for sudo on a native host — "a runner that needs one should say so".
      # This is the runner saying so. -E keeps the environment setup-dotnet
      # arranged, and PATH is passed explicitly because sudo resets it.
      - name: Test (Zonemaster, and Knot/CoreDNS/Unbound as peers)
        timeout-minutes: 30
        run: >
          sudo -E env "PATH=$PATH"
          dotnet test DNSConformanceTests.slnx --configuration Release --no-build
          --filter "TestCategory=Docker"
          --logger "console;verbosity=normal"
          --logger "trx;LogFilePrefix=containers"
          --results-directory artifacts

      # A skip here means the guards above passed and the harness bailed anyway,
      # which is a harness bug rather than a missing tool. dotnet test reports
      # success either way, so the tick would be green and empty. The TRX
      # Counters element is what says which it was.
      - name: Fail if nothing actually ran
        if: ${{ !cancelled() }}
        run: |
          # One TRX per test project, and the projects with no test in this
          # category produce an empty one — so the counters have to be summed
          # rather than read off the first file that happens to sort first.
          counters=$(grep -ohE '<Counters [^/]*/>' artifacts/*.trx)
          echo "$counters"
          total() { echo "$counters" | grep -oE "$1=\"[0-9]+\"" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}'; }
          passed=$(total passed)
          skipped=$(total notExecuted)
          echo "passed=$passed notExecuted=$skipped"
          test "$skipped" -eq 0 || { echo 'Container tests skipped although every prerequisite was present.' >&2; exit 1; }
          test "$passed"  -gt 0 || { echo 'No container test passed — the report says nothing ran.' >&2; exit 1; }

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-container-servers
          path: artifacts/*.trx

  # ---------------------------------------------------------------------------
  # The upstream-tool lane: the interop suite against the DNS tools as their own
  # projects ship them, rather than as Debian does.
  # ---------------------------------------------------------------------------
  upstream-tools:
    # The full-suite job judges Hermod against what trixie packages, and that is
    # the right default: it is what a developer's WSL has, which keeps the desk
    # and CI comparable. It is also, for two of the three tool families, behind.
    #
    #   dig / delv / named   BIND     trixie 9.20.29   upstream stable 9.20.29
    #   kdig                 Knot     trixie 3.4.6     upstream 3.6.0
    #   drill                ldns     trixie 1.8.4     upstream 1.9.2
    #
    # BIND is the interesting case and the reason this lane says "upstream tools"
    # rather than "newer tools". ISC's own stable channel carries exactly what
    # trixie carries, so there is no forward stable version to test against at
    # all; the only thing ahead is the 9.21 development branch. That is a
    # different claim from Knot's and ldns's -- it is an early warning about
    # behaviour heading for a future stable, not a check against what operators
    # run today -- and it is worth having for precisely that reason.
    #
    # Every version is discovered rather than pinned, which is the whole reason
    # this belongs in a nightly: the question worth asking each morning is
    # "do the tools released this month still agree with us", and a pinned
    # version stops asking it the day after it is written. SSHConformanceTests'
    # own upstream lane made that argument first and it is right.
    #
    # Informational, like the live-resolver lane and for a related reason: a red
    # here can mean Hermod is wrong, or that a tool changed on purpose, or that
    # one of three third-party channels moved -- and only the first is a finding
    # about this repository. The step summary carries every discovered version,
    # so a real disagreement needs no hunting for.
    continue-on-error: true
    runs-on: ubuntu-latest
    container: debian:13
    steps:

      # git before the checkout: without it actions/checkout falls back to a
      # REST tarball, which cannot fetch submodules -- and libs/Hermod IS the
      # library under test.
      - name: Install git (Debian container)
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install .NET prerequisites (Debian container)
        run: apt-get install -y --no-install-recommends curl libicu76 libssl3t64 libstdc++6 tzdata

      # The distro packages go on first and are then upgraded out from under
      # themselves, which sounds backwards and is not: Debian's packaging is
      # what creates the bind user and /var/cache/bind, and what brings the
      # pieces the upgrade does not replace -- named-checkconf and
      # named-checkzone for the fixture's staging, socat for genreport's
      # harness. The build tools are for ldns and genreport; libssl-dev serves
      # both, and libc6-dev is here because it is only a *recommended*
      # dependency of gcc, so --no-install-recommends otherwise leaves the
      # compiler unable to link ("C compiler cannot create executables").
      - name: Install the distro DNS tools and the build prerequisites
        run: |
          apt-get install -y --no-install-recommends \
            bind9-dnsutils knot-dnsutils ldnsutils bind9 bind9utils \
            gcc libc6-dev make autoconf automake pkg-config libssl-dev socat \
            apt-transport-https wget

      # BIND and Knot both ship signed Debian repositories, so they arrive as
      # packages rather than as builds. Both suites are discovered, not pinned:
      #
      #  * bind.debian.net -- ISC's documented entry point for Debian packages,
      #    which redirects to packages.sury.org, the repository of Debian's own
      #    BIND maintainer. It carries one suite per branch (bind-9.18,
      #    bind-9.20, bind-9.21, ...), so the newest numbered branch is read off
      #    the index. Reading the directory listing rather than naming a branch
      #    is what makes this follow 9.23 by itself one day.
      #  * pkg.labs.nic.cz -- CZ.NIC's own Knot DNS repository, which has a
      #    trixie suite and tracks the current release.
      #
      # Both are third-party channels, which is part of why this lane cannot
      # gate anything: a repository that moves or goes away must not turn a
      # night red.
      - name: Add the upstream channels and upgrade BIND and Knot
        run: |
          set -e
          branch="$(curl -sL https://bind.debian.net/ \
                    | grep -oE 'bind-9\.[0-9]+/' | tr -d '/' | sort -Vu | tail -1)"
          if [ -z "${branch}" ]; then
            echo "could not read a branch directory from bind.debian.net" >&2
            exit 1
          fi
          echo "BIND branch discovered: ${branch}"
          echo "BIND_BRANCH=${branch}" >> "${GITHUB_ENV}"

          curl -sLo /tmp/sury-keyring.deb https://bind.debian.net/debsuryorg-archive-keyring.deb
          dpkg -i /tmp/sury-keyring.deb
          echo "deb https://bind.debian.net/${branch}/ trixie main" > /etc/apt/sources.list.d/bind.list

          wget -qO /usr/share/keyrings/cznic-labs-pkg.gpg https://pkg.labs.nic.cz/gpg
          echo "deb [signed-by=/usr/share/keyrings/cznic-labs-pkg.gpg] https://pkg.labs.nic.cz/knot-dns trixie main" \
            > /etc/apt/sources.list.d/cznic-labs-knot-dns.list

          apt-get update
          apt-get install -y --no-install-recommends bind9 bind9-dnsutils bind9-utils knot-dnsutils

      # ldns has no upstream Debian repository, so drill is built. Two details
      # that are not obvious and both cost a round trip to find out:
      #
      #  * drill is NOT built by default -- --with-drill is required, and
      #    without it the build succeeds and produces no drill at all.
      #  * the drill left in the build tree is a libtool wrapper script, not an
      #    executable, so copying it the way this lane's chrony equivalent
      #    copies binaries would install a shell script that cannot run. Hence
      #    make install, and hence --libdir pointing at the multiarch directory:
      #    that puts the new libldns.so.3 where the distro's was instead of
      #    beside it, leaving one library on the system rather than two for the
      #    linker to choose between. ldconfig then refreshes the cache.
      - name: Build and install upstream ldns
        run: |
          set -e
          cd /tmp
          tarball="$(curl -sL https://www.nlnetlabs.nl/downloads/ldns/ \
                     | grep -oE 'ldns-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' | sort -Vu | tail -1)"
          if [ -z "${tarball}" ]; then
            echo "could not read a release from the ldns download listing" >&2
            exit 1
          fi
          echo "ldns release discovered: ${tarball}"
          curl -fsSLO "https://www.nlnetlabs.nl/downloads/ldns/${tarball}"
          tar xzf "${tarball}"
          cd "${tarball%.tar.gz}"
          ./configure --prefix=/usr --libdir=/usr/lib/x86_64-linux-gnu --with-drill
          make -j"$(nproc)"
          make install
          ldconfig

      # Written down before anything is built against them, so a job that dies
      # later still says what it was holding -- and written to the log as well
      # as the summary, because whoever investigates a red lane from the command
      # line reads the log.
      - name: Record the tool versions
        run: |
          {
            echo '## Upstream DNS tools under test'
            echo
            echo '```'
            dig -v 2>&1 | head -1
            delv -v 2>&1 | head -1
            kdig --version 2>&1 | head -1
            drill -v 2>&1 | head -1
            named -V 2>&1 | head -1
            echo '```'
            echo
            echo "BIND came from the ${BIND_BRANCH} branch of bind.debian.net."
            echo
            echo 'Debian 13 for comparison: BIND 9.20.29, Knot 3.4.6, ldns 1.8.4 — the'
            echo 'versions the full-suite job tests and a developer WSL has.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # genreport is the one verdict the suite cannot reach by itself, so it is
      # built here for the same reason full-suite builds it.
      - name: Build ISC genreport (Debian container)
        run: sh interop/genreport/build-genreport.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Re-signed with the UPSTREAM BIND, deliberately. dnssec-signzone is one
      # of the tools this lane is about, so if a newer signer emits something
      # Hermod cannot read, that is exactly the finding worth having. The
      # committed signatures expire a month after they were made, so this step
      # also keeps the lane from going red for that reason alone.
      - name: Re-sign the DNSSEC fixtures with the upstream BIND
        run: sh fixtures/zones/resign.sh

      # The guard that this lane exists to deserve. Every interop check here
      # gates itself on its tool: TestEnvironment calls Assert.Ignore when one
      # is missing, NUnit counts a skip rather than a failure, and a lane of
      # nothing but skips exits 0 having proved nothing. NTSConformanceTests
      # reported agreement with chrony 4.9 for a whole run that way, with a
      # chronyd that had exited at startup every time.
      #
      # So each tool has to answer, and named has to actually serve: the one
      # daemon in the list is started from this repository's own fixture
      # template, with the fixture's own zone, validated by named-checkconf and
      # then queried with dig exactly as BindServerFixture queries it. A tool
      # that is present but cannot run is the failure mode this catches, and
      # running the fixture's own configuration is the only way to catch it
      # before the suite does.
      - name: Smoke-test that every tool answers and named serves
        run: |
          set -e
          for tool in dig delv kdig drill named named-checkconf named-checkzone genreport; do
            command -v "${tool}" > /dev/null || { echo "FAIL: ${tool} is not on PATH"; exit 1; }
          done

          work=/tmp/smoke-bind
          port=24653
          mkdir -p "${work}"
          cp fixtures/bind/interop.test.zone "${work}/"
          if [ -f fixtures/zones/signed/dnssec.test.zone.signed ]; then
            cp fixtures/zones/signed/dnssec.test.zone.signed "${work}/"
          else
            printf '$TTL 3600\n@ IN SOA ns1.dnssec.test. hostmaster.dnssec.test. ( 1 7200 3600 1209600 3600 )\n@ IN NS ns1.dnssec.test.\nns1 IN A 192.0.2.53\n' \
              > "${work}/dnssec.test.zone.signed"
          fi
          sed -e "s|__DIR__|${work}|g" -e "s|__PORT__|${port}|g" \
            fixtures/bind/named.conf.template | tr -d '\r' > "${work}/named.conf"

          echo '--- named-checkconf on the fixture template ---'
          named-checkconf "${work}/named.conf"

          echo '--- named, started the way BindServerFixture starts it ---'
          named -c "${work}/named.conf" -g > "${work}/named.log" 2>&1 &
          answered=no
          for _ in $(seq 1 25); do
            sleep 0.2
            if [ -n "$(dig @127.0.0.1 -p "${port}" +time=1 +tries=1 +short a.interop.test A 2>/dev/null)" ]; then
              answered=yes
              break
            fi
          done
          echo 'its output:'
          sed 's/^/  /' "${work}/named.log" || true
          pkill -f "named -c ${work}/named.conf" || true

          if [ "${answered}" != "yes" ]; then
            {
              echo
              echo '### The upstream named did not serve'
              echo
              echo 'The interop checks were not run: with no server they would have'
              echo 'skipped themselves and left this job green on no evidence. The'
              echo 'step log has named output verbatim.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'FAIL: the upstream named never answered the fixture query'
            exit 1
          fi
          echo 'named served the fixture zone.'

      - name: Build
        run: dotnet build DNSConformanceTests.slnx --configuration Release

      # The same filter the pinned-tool interop lane uses, so the two are
      # directly comparable, and a skip is a failure here for the reason the
      # smoke test above exists. The counts are summed rather than read from a
      # grand total because this filter spans two assemblies and the SDK prints
      # one summary each; summing cannot flip the verdict, since zeroes sum to
      # zero.
      - name: Test (interop against the upstream tools)
        timeout-minutes: 45
        shell: bash
        run: |
          set +e
          dotnet test DNSConformanceTests.slnx --configuration Release --no-build \
            --filter "TestCategory=WSL" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFilePrefix=upstream-interop" \
            --results-directory artifacts > "${RUNNER_TEMP}/interop.out" 2>&1
          rc=$?
          cat "${RUNNER_TEMP}/interop.out"
          skipped=0
          passed=0
          for n in $(grep -oE 'Skipped: +[0-9]+' "${RUNNER_TEMP}/interop.out" | grep -oE '[0-9]+'); do
            skipped=$((skipped + n))
          done
          for n in $(grep -oE 'Passed: +[0-9]+' "${RUNNER_TEMP}/interop.out" | grep -oE '[0-9]+'); do
            passed=$((passed + n))
          done
          {
            echo
            echo '### Interop against the upstream tools'
            echo
            echo "passed ${passed}, skipped ${skipped} (the pinned-tool lane: 73 passed, 0 skipped)"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${rc}" -eq 0 ] || exit "${rc}"
          if [ "${skipped}" -ne 0 ]; then
            echo "FAIL: ${skipped} interop checks skipped although every tool answered."
            exit 1
          fi

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-upstream-tools
          path: artifacts/*.trx
