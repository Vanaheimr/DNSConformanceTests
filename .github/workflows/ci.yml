name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs from the Actions tab ("Run workflow"), same as nightly.yml.
  workflow_dispatch:

concurrency:
  # Pull requests: one run per branch, newest wins — a run against a head
  # that has been superseded is answering a question nobody is asking any
  # more.
  #
  # Pushes: one run per commit, and nothing cancels anything. A commit with
  # no verdict is a hole nobody comes back to fill: the next commit contains
  # it, so the code does get tested eventually, but once that run is red
  # there is no longer any way to say which of the two commits did it.
  #
  # Keying the group on the SHA, rather than only turning cancel-in-progress
  # off, is what makes that hold for more than two pushes: a group keeps at
  # most one run *pending*, so a third push discards the second before it
  # ever starts.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-suite:
    # The same two legs as Hermod's own CI, for the same reason: the code under
    # test is Hermod, and a conformance result that only holds on one platform
    # is worth knowing about. TLS goes through Schannel on Windows and OpenSSL
    # on Debian, which is exactly the kind of difference the DoT tests can see.
    #
    # fail-fast is off on purpose — "red on exactly one platform" is the most
    # informative thing this matrix can produce, so one leg must not cancel the
    # other.
    #
    # `leg` exists so the two runs can be told apart by name rather than by
    # runner image: the Linux leg runs on ubuntu-latest but IS Debian 13, and
    # an artifact called "test-results-ubuntu-latest" would say the opposite of
    # what it contains.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    name: ${{ matrix.leg }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Unlike Hermod, this repository consumes its dependencies as submodules,
      # so one recursive checkout gets Hermod and Styx at the revisions the
      # gitlinks name. That is the point: the gate tests the pinned pair, which
      # is what a fresh clone would build. Testing against Hermod master is the
      # nightly's job, and deliberately a different question.
      # Before the checkout, and this order is load-bearing. The bare debian:13
      # image ships no git, and without it actions/checkout does not clone — it
      # downloads a tarball through the REST API, which cannot carry submodules
      # and fails with "Input 'submodules' not supported". Hermod's CI never
      # meets this because it checks out two plain repositories side by side.
      - name: Install git (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The bare debian:13 container has none of the .NET prerequisites: curl
      # for the dotnet-install script setup-dotnet runs, ICU and tzdata for
      # globalization, OpenSSL for crypto, ca-certificates for NuGet over HTTPS.
      # Package names are Debian 13 (trixie).
      - name: Install .NET prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get install -y --no-install-recommends curl libicu76 libssl3t64 libstdc++6 tzdata

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build DNSConformanceTests.slnx --configuration Release

      # Everything that needs nothing but loopback sockets. No network, no
      # external tools, no Docker — so a red here means a conformance result
      # changed, never that a resolver was slow or a package was missing. That
      # is what makes it usable as a gate.
      #
      # Online and WSL run in nightly.yml, where a network failure can be read
      # as a network failure instead of turning a merge red.
      - name: Test (offline)
        timeout-minutes: 30
        run: >
          dotnet test DNSConformanceTests.slnx --configuration Release --no-build
          --filter "TestCategory!=Online&TestCategory!=WSL&TestCategory!=Docker"
          --logger "console;verbosity=normal"
          --logger "trx;LogFilePrefix=offline"
          --results-directory artifacts

      # Which tests ran, which skipped and with what reason is the most useful
      # thing this workflow knows, and exactly what the console log does not
      # preserve once a run ages out. TRX keeps it per test, including the skip
      # reason — one file per test project, which is why this is LogFilePrefix
      # rather than LogFileName: ten projects writing the same name would
      # overwrite each other.
      #
      # !cancelled() rather than success(): a red run is when these files
      # matter most, and uploading only on green would throw away the evidence
      # in exactly that case. A build that fails before the test step leaves no
      # .trx at all, which upload-artifact reports as a warning rather than a
      # second failure — the build error is the finding there.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: artifacts/*.trx
